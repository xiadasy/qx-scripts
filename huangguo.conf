#!name=黄果短剧
#!desc=Safari 打开黄果站点即可播：详情 302 进播放页，播放页换成原生 HLS，CDN 自动补 Referer。
#!homepage=https://github.com/xiadasy/qx-scripts
#!author=xiadasy

# 详情页没有播放地址，直接进 /video/{id}/
^https?:\/\/(?:www\.)?huangguo(?:ai\.(?:com|ai)|3\.com)\/detail\/(\d+)\/?(?:\?.*)?$ url 302 https://huangguoai.com/video/$1/

# 播放页换成原生 HLS 播放器（选集 / nPlayer / Infuse）
^https?:\/\/(?:www\.)?huangguo(?:ai\.(?:com|ai)|3\.com)\/video\/ url script-response-body https://raw.githubusercontent.com/xiadasy/qx-scripts/main/huangguo.js?v=1

# CDN 分片、key 补 Referer，避免 403
^https?:\/\/[^\/]+\.(?:nkgjoa|vjxyrj)\.cn\/.+\.(?:m3u8|ts|key)(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/xiadasy/qx-scripts/main/huangguo-hls.js?v=1

hostname = %APPEND% huangguoai.com, www.huangguoai.com, huangguoai.ai, huangguo3.com, yd-hls.nkgjoa.cn, tp6.vjxyrj.cn, pic.vjxyrj.cn, *.nkgjoa.cn, *.vjxyrj.cn
